<!DOCTYPE html>
<html>
    <head>
        <style>
            a {
                color: rgb(0, 113, 133);
            }

            a:hover{
                color: rgb(220, 158, 13);
            }

            .product-name {
                font-size: 20px;
                font-weight: bold;
            }
            .product-price {
                color: rgb(0, 118, 0);
                font-weight: bold;
            }

            .add-to-cart-button{
                background-color: rgb(255, 216, 20);
                color: black;
                height: 30px;
                width: 100px;
                border: none;
                border-radius: 15px;
                cursor: pointer;
                margin-right: 5px;
                transition: background-color 0.15s, opacity 0.15s;
            }

            .add-to-cart-button:hover{
                background-color: rgb(233, 183, 67);;
            }

            .add-to-cart-button:active{
                opacity: 0.5;
            }

            .buy-now-button{
                 background-color: rgb(255, 164, 28);
                color: black;
                height: 30px;
                width: 100px;
                border: none;
                border-radius: 15px;
                cursor: pointer;
                margin-right: 5px;
                transition: background-color 0.15s, opacity 0.15s;
            }

            .buy-now-button:hover{
                background-color: rgb(202, 111, 26);
            }

            .buy-now-button:active{
                opacity: 0.5;
            }
        </style>
    </head>
    <body>
        <a href="https://www.amazon.com">Back to Amazon</a><br>
        <p class="product-name">Nike Black Running Shoes</p>
        <p class="product-price">$39 - in stock.</p>
        <p>Free Delivery Tomorrow.</p>
        <button class="add-to-cart-button">
            Add to Cart
        </button> 
        
        <button class="buy-now-button">
            Buy Now
        </button>
    </body>
</html>
