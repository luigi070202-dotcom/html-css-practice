<!DOCTYPE html>
<html>
    <head>
       <style>
            p{
                font-family: Arial, Helvetica, sans-serif;
                margin-top: 0;
                margin-bottom: 0;
            }

            .friend-suggestion-grid{
                display: grid;
                grid-template-columns: 175px 175px 175px;
                column-gap: 20px;
                row-gap: 20px;
                border: 1px solid rgba(101, 101, 101, 0.427);
                width: 575px;
                padding: 10px;
            }

            .profile-container{
                padding: 10px;
                border: 1px rgba(101, 101, 101, 0.427);
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
            }

            .profile-pic-div{
                width: 100%;
                height: 160px;
            }

            .mutual-grid{
                display: grid;
                grid-template-columns: 30px 1fr;
                padding-left: 2px;
                align-items: center; 
            }

            .profile-pic,
            .mutual-pic{
                object-fit: cover;
                width: 100%;
                height: 100%;
            }

            .profile-name{
                padding-left: 2px;
                font-size: 20px;
            }

            .mutual-pic{
                height: 30px;
                width: 30px;
                border-radius: 50%;
            }

            .mutual-friend-count{
                padding-left: 5px;
                font-size: 14px;
            }

            button {
                display: block;
                margin: 5px auto 0 auto; /* centers button horizontally */
                padding: 5px 10px;
                cursor: pointer;
                background-color: rgb(16, 108, 247);
                color: white;
                border: none;
                border-radius: 2px;
                font-family: arial;
                font-size: 12px;
            }

       </style>
    </head>
