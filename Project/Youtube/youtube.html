<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../Youtube/Styles/general.css" />
    <link rel="stylesheet" href="../Youtube/Styles/header.css" />
    <link rel="stylesheet" href="../Youtube/Styles/video.css" />
  </head>
  <body>
    <div class="header">
      <div class="left-section">
        <img
          class="hamburger-menu"
          src="../Youtube/Icons/Header Icons/hamburger-menu.svg"
          alt=""
        />
        <img
          class="youtube-logo"
          src="../Youtube/Logo/youtube-logo.svg"
          alt=""
        />
      </div>
      <div class="middle-section">
        <input class="search-bar" type="text" placeholder="Search" />
        <button class="search-icon">
          <img src="../Youtube/Icons/Header Icons/search.svg" alt="" />
        </button>
        <button class="voice-search-icon">
          <img
            src="../Youtube/Icons/Header Icons/voice-search-icon.svg"
            alt=""
          />
        </button>
      </div>
      <div class="right-section"></div>
    </div>

    <div class="all-videos-container">
      <div class="video-container">
        <div class="thumbnail-container">
          <img class="thumbnail" src="Thumbnail/thumbnail-1.webp" alt="" />
        </div>
        <div class="video-info-container">
          <div class="channel-container">
            <img class="channel" src="Channels/channel-1.jpeg" alt="" />
          </div>
          <div class="video-info">
            <p class="video-title">
              Talking Tech and AI with Google CEO Sundar Pichai!
            </p>
            <p class="video-author">Marques Brownlee</p>
            <p class="video-stats">3.4M views · 6 months ago</p>
          </div>
        </div>
      </div>
      <div class="video-container">
        <div class="thumbnail-container">
          <img class="thumbnail" src="Thumbnail/thumbnail-2.webp" alt="" />
        </div>
        <div class="video-info-container">
          <div class="channel-container">
            <img class="channel" src="Channels/channel-2.jpeg" alt="" />
          </div>
          <div class="video-info">
            <p class="video-title">Try Not To Laugh Challenge #9</p>
            <p class="video-author">Markiplier</p>
            <p class="video-stats">19M views · 4 years ago</p>
          </div>
        </div>
      </div>
      <div class="video-container">
        <div class="thumbnail-container">
          <img class="thumbnail" src="Thumbnail/thumbnail-3.webp" alt="" />
        </div>
        <div class="video-info-container">
          <div class="channel-container">
            <img class="channel" src="Channels/channel-3.jpeg" alt="" />
          </div>
          <div class="video-info">
            <p class="video-title">
              Crazy Tik Toks Taken Moments Before DISASTER
            </p>
            <p class="video-author">SSSniperWolf</p>
            <p class="video-stats">12M views · 1 year ago</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
