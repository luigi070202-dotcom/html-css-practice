<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Flexbox</title>
    <style>
        p{
            margin: 0px;
        }
    </style>
</head>
<body>
    <div style="
            display: flex;
            height: 50px;
        ">
            <div style="
                background-color: lightblue;
                width: 100px;
                display: flex;
                justify-content: center;
                align-items: center;
            ">item1</div>
            
            <div style="
                background-color: lightpink;
                width: 200px;
            "></div>
    </div>

    <div style="
            margin-top: 20px;
            display: flex;
            height: 50px;
        ">
            <div style="
                background-color: lightblue;
                width: 100px;
            "></div>
            
            <div style="
                background-color: lightpink;
                width: 200px;
                display: flex;
                flex-direction: column;
            ">
                
                <p>row1</p>
                <div style="
                    flex: 1;
                    display: flex;
                    flex-direction: row;
                    justify-content: space-between;
                    ">
                        <p>row2</p>
                        <p>row3</p>
                </div>
            </div>
    </div>

</body>
</html>
