<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Position Relative</title>
        <style>
            body{
                position: relative;
                height: 3000px;
            }

            .close-button{
                background-color: black;
                color: white;
                position: absolute;
                right: 0px;
                top: 0px;
                height: 50px;
                width: 50px;
                border-radius: 25px;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 25px;
            }

            .bottom-container{
                background-color: gray;
                height: 180px;
                width: 320px;
                position: absolute;
                bottom: 0px;
                right: 5px;
            }

            .ad-close-button{
                background-color: black;
                color: white;
                position: absolute;
                left: -22px;
                top: -18px;
                height: 50px;
                width: 50px;
                border-radius: 25px;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 25px;
            }

            .bottom-countainer{
                position: relative;
            }

            .timestamp{
                position: absolute;
                background-color: black;
                color: white;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 25px;
                bottom: 10px;
                right: 10px;
            }
        </style>
    </head>
    <body> 
        <div class="close-button">
            X
        </div>
        <div class="bottom-container">
            <div class="ad-close-button">
                X
            </div>
            <div class="timestamp">
                10:16
            </div>
        </div>
    </body>
</html>
