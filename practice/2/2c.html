<!DOCTYPE html>
<html>
    <head>
        <style>
            button{
                background-color: rgb(46, 164, 79);
                color: white;
                height: 40px;
                width: 100px;
                border: none;
                border-radius: 2px;
                font-size: 15px;
                font-weight: bold;
                cursor: pointer;
                transition: box-shadow 0.15s;
            }

            button:hover{
                box-shadow: 0 5px 10px rgba(0, 0, 0, 0.15);
            }
        </style>
    </head>
    <body>
        <button>Sign Up</button>
    </body>
</html>
