<!DOCTYPE html>
<html>
    <head>
        <title>Flexbox Practice</title>
    </head>
    <body>
        <div style="
            display: flex;
        ">
            <div style="
                background-color: lightblue;
                width: 200px;
            ">200px</div>
            
            <div style="
                background-color: lightpink;
                width: 75px;
            ">75px</div>
        </div>

        <div style="
            display: flex;
            margin-top: 20px;
        ">
            <div style="
                background-color: lightblue;
                width: 50px;
            ">item1</div>
            
            <div style="
                background-color: lightpink;
                flex: 1;
            ">item2</div>

            <div style="
                background-color: lightblue;
                width: 75px;
            ">item3</div>
        </div>

        <div style="
            display: flex;
            margin-top: 20px;
            justify-content: space-between;
        ">
            <div style="
                background-color: lightblue;
                width: 50px;
            ">item1</div>
            
            <div style="
                background-color: lightpink;
                width: 50px;
            ">item2</div>

            <div style="
                background-color: lightblue;
                width: 50px;
            ">item3</div>

            <div style="
                background-color: lightpink;
                width: 50px;
            ">item4</div>
        </div>

        <div style="
            display: flex;
            margin-top: 20px;
            height: 50px;
            border: 1px solid gray;
            align-items: center;
            justify-content: space-between;
        ">
            <div style="
                background-color: lightblue;
                width: 50px;
            ">50px</div>
            
            <div style="
                background-color: lightpink;
                width: 50px;
            ">50px</div>
        </div>
    </body>
</html>
