<!DOCTYPE html>
<html>
    <head>
        <style>
            button{
                background-color: rgb(255, 216, 20);
                color: black;
                height: 40px;
                width: 200px;
                border: none;
                border-radius: 20px;
                font-size: 15px;
                cursor: pointer;
                transition: background-color 0.15s;
            }

            button:hover{
                background-color: rgb(255, 181, 20);
            }
        </style>
    </head>
    <body>
        <button>Add To Cart</button>
    </body>
</html>
