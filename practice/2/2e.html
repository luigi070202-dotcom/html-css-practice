<!DOCTYPE html>
<html>
    <head>
        <style>
            .apply-button{
                background-color: rgb(10, 102, 194);
                color: white;
                height: 40px;
                width: 220px;
                border: none;
                border-radius: 20px;
                font-weight: bold;
                cursor: pointer;
                transition: background-color 0.15s;
            }

            .apply-button:hover{
                background-color: rgb(8, 82, 158);
            }

            .save-button{
                background-color: white;
                color: rgb(10, 102, 194);
                height: 40px;
                width: 80px;
                border: 1px solid rgb(10, 102, 194);
                border-radius: 20px;
                font-size: 15px;
                font-weight: bold;
                cursor: pointer;
                transition: background-color 0.15s, border-width 0.15s;
            }

            .save-button:hover{
                background-color: rgb(233, 236, 242);
                border-width: 3px;

            }
        </style>
    </head>
    <body>
        <button class="apply-button">
            Apply on Company Website
        </button>

        <button class="save-button">
            Save
        </button>
    </body>
</html>
