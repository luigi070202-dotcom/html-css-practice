<!DOCTYPE html>
<html>
    <head>
        <title>Images</title>
        <style>
            p{
                font-family: arial;
                font-size: 12px;
                margin-top: 0;
                margin-bottom: 5px;
            }

            .ryusui{
                width: 200px;
                border-radius: 20px;
                margin-bottom: 10px;
            }

            .ryusui1{
                width: 150px;
                height: 150px;
                object-position: center;
                object-fit: cover;
                margin-left: 20px;
                margin-bottom: 10px;
            }

            .ryusui2{
                width: 150px;
                height: 150px;
                object-fit: cover;
                border-radius: 50%;
                margin-left: 20px;
                margin-bottom: 10px;
            }

            .ryusui3{
                width: 30px;
                height: 30px;
                object-fit: cover;
                border-radius: 50%;
                margin-right: 20px;
                margin: 0;
                vertical-align: middle;
            }

            .search1{
                width: 200px;
                height: 20px;
                border-radius: 5px;
                border: solid 1px gray;
                margin-bottom: 10px;
                font-size: 10px;
                padding-left: 5px;
            }

            .search2{
                width: 300px;
                height: 25px;
                border-radius: 15px;
                border: none;
                box-shadow: 0px 0px 5px lightgray;
                font-size: 10px;
                padding-left: 5px;
                margin-bottom: 20px;
            }

            .email{
                font-family: arial;
                font-size: 10px;
                margin-top: 0;
                margin-bottom: 5px;
                width: 200px;
            }

            .terms{
                font-family: arial;
                font-size: 8px;
                color: gray;
                width: 250px;
            }

            .agree-button{
                width: 200px;
                height: 30px;
                background-color: #0a66c2;
                color: white;
                border: none;
                border-radius: 50px;
                font-size: 12px;
                cursor: pointer;
                margin-bottom: 50px;
            }

            .tweet{
                width: 200px;
                font-family: arial;
                font-size: 12px;
                border: none;
                padding-left: 5px;
                margin: 0;
                vertical-align: middle;
            }

            .tweet-button{
                height: 30px;
                width: 60px;
                background-color: #1da1f2;
                color: white;
                border: none;
                border-radius: 50px;
                font-size: 12px;
                cursor: pointer;
                margin-left: 10px;
                vertical-align: middle;
                font-weight: bold;
            }

            .tweet-button:hover{
                background-color: #0d8ddb;
            }
        </style>
    </head>
    <body>
        <img class="ryusui" src="../assets/ryusui.jpg" alt="Ryusui">
        <img class="ryusui1" src="../assets/ryusui.jpg" alt="Ryusui1">
        <img class="ryusui2" src="../assets/ryusui.jpg" alt="Ryusui2">
        <br>
        <input class="search1" type="text" placeholder="Search">
        <br>
        <input class="search2" type="text" placeholder="Search Google or type a URL">
        <br>
        <p>Email</p>
        <input class="email" type="text" placeholder="Email">
        <p class="terms">By clicking Agree &amp; Join, you agree to the Privacy Policy.</p>
        <button class="agree-button">Agree & Join</button>
        <br>
        <img class="ryusui3" src="../assets/ryusui.jpg" alt="Ryusui2">
        <input class="tweet" type="text" placeholder="What's happening?">
        <button class="tweet-button">Tweet</button>
    </body>
</html>
