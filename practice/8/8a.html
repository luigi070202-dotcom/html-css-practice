<!DOCTYPE html>
<html>
    <head>
        <style>
            .name-text,.email-text{
                display: block;
                margin-bottom: 10px;
            }

            p{
                display: inline-block;
                width: 200px;
                vertical-align: middle;
            }

            button{
                display: inline-block;
                vertical-align: middle;
            }


            .google-logo{
                width: 150px;
                margin-top: 20px;
                margin-bottom: 10px;
                margin-left: 75px;
                display: block;
            }

            .search{
                width: 300px;
                height: 25px;
                border-radius: 15px;
                border: none;
                box-shadow: 0px 0px 5px lightgray;
                font-size: 10px;
                padding-left: 5px;
                margin-bottom: 20px;
            }

            .first-name,.last-name{
                display: inline-block;
                width: 100px;
                margin-bottom: 10px;
            }

            .email{
                display: block;
                width: 212px;
                margin-bottom: 10px;
            }

            .sign-up-button{
                display: block;
                background-color: rgb(63, 162, 224);
                color: white;
                width: 220px;
                height: 25px;
                border: none;
                border-radius: 4px;
                font-size: 10px;
                font-family: arial;
                padding-top: 5px;
                padding-bottom: 5px;
            }

            .ride-title{
                font-family: arial;
                font-size: 20px;
                margin-bottom: 10px;
                display: block;
            }

            .pickup-location,.destination{
                display: block;
                width: 275px;
                height: 25px;
                border: none;
                box-shadow: 0px 0px 5px lightgray;
                font-size: 10px;
                padding-left: 5px;
                margin-bottom: 10px;
            }

            .request-now,.schedule-later{
                display: inline-block;
            }

            .request-now{
                background-color: black;
                font-family: arial;
                color: white;
                width: 140px;
                height: 30px;
                border: none;
            }

            .schedule-later{
                background-color: rgb(227, 227, 227);
                font-family: arial;
                color: black;
                width: 140px;
                height: 30px;
                border: none;
            }
        </style>
    </head>
    
    <body>
        <input class="name-text" type="text" placeholder="Name">
        <input class="email-text" type="text" placeholder="Email">
        <br>
        <p>
            Thanks for chatting with our customer support. Would you like to take our quick survey?
        </p>
        <button>Yes</button>
        <button>No</button>
        <br>
        <img class="google-logo" src="../../Google_2015_logo.svg.webp" alt="Google Logo">
        <input class="search" type="text" placeholder="Search Google or type a URL">
        <br>
        <input class="first-name" type="text" placeholder="First Name">
        <input class="last-name" type="text" placeholder="Last Name">
        <input class="email" type="text" placeholder="Email">
        <button class="sign-up-button">Sign Up</button>
        <br>
        <p class="ride-title">Request a ride now</p>
        <input class="pickup-location" type="text" placeholder="Enter pickup location">
        <input class="destination" type="text" placeholder="Enter destination">
        <button class="request-now">Request now</button>
        <button class="schedule-later">Schedule for later</button>
    </body>
</html>
