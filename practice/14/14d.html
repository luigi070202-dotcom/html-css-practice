<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=, initial-scale=1.0">
        <title>Position</title>
        <link rel="stylesheet" href="14d-header.css">
        <link rel="stylesheet" href="14d-sidebar.css">
        <style>
            p{
                font-family: Arial, Helvetica, sans-serif;
                margin: 0;
            }
        </style>
    </head>
    <body style="height: 3000px;">
        <div class="header">
            <div class="profile-info">
                <img src="../assets/ryusui.jpg" alt="ryusui">
                <p class="profile-name">Nanami Ryusui</p>
            </div>
            <div class="buttons">
                <button class="add-button">Add Friend</button>
                <button class="message-button">Message</button>
            </div>
        </div>

        <div class="sidebar-flex">
            <div class="profile-sidebar">
                <img class="profile-pic" src="../assets/gen.webp" alt="">
                <img class="profile-pic" src="../assets/ryusui.jpg" alt="">
                <img class="profile-pic" src="../assets/senku.avif" alt="">
            </div>
            <div class="channels-sidebar">
                <div class="channel-label">
                    <p class="info">INFO</p>
                    <button class="plus">+</button>
                </div>
                <div class="channels">
                    <p class="channels-name">#&emsp;new-videos</p>
                    <p class="channels-name">#&emsp;updates</p>
                    <p class="channels-name">#&emsp;faq</p>
                </div>
            </div>
        </div>
    </body>
</html>
