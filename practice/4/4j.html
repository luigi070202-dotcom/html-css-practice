<!DOCTYPE html>
<html>
    <head>
        <style>
            button{
                background-color: rgb(46, 164, 79);
                color: white;
                height: 40px;
                width: 100px;
                border: none;
                border-radius: 2px;
                font-size: 15px;
                font-weight: bold;
                cursor: pointer;
                transition: box-shadow 0.15s;
                transform-style: preserve-3d;
                position: relative; /* Needed for positioning pseudo-elements or inner elements */
                transition: transform 0.2s;
            }

            button:hover{
                box-shadow: 0 5px 10px rgba(0, 0, 0, 0.15);
            }

            button:active{
                transform: translateY(3px) translateX(4px); 
                box-shadow: 0 0 0 rgba(0, 0, 0, 0);
            }
        </style>
    </head>
    <body>
        <button>Shadow</button>
    </body>
</html>
