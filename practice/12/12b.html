<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Flexbox Practice 1</title>
        <style>
            .container{
                border: 1px solid gray;
                width: 400px;
                padding: 10px;
            }
            
            .header-container{
                display: flex;
                width: 100%;
                justify-content: space-between;
                align-items: center;
            }

            .notif-title{
                flex: 1;
                text-align: start;
            }

            .notif-count{
                width: 40px;
                text-align: end;
            }

            .count{
                background-color: rgb(45, 99, 255);
                color: white;
                border-radius: 99px;
                padding: 4px 10px;
                font-size: 14px;
                font-weight: bold;
                text-align: center;
                display: inline-block;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header-container">
                <div class="notif-title">
                    <p>Home</p>
                </div>
                <div class="notif-count">
                    <p class="count">2</p>
                </div>
            </div>
            <div class="header-container">
                <div class="notif-title">
                    <p>Notifications</p>
                </div>
                <div class="notif-count">
                    <p class="count">14</p>
                </div>
            </div>
            <div class="header-container">
                <div class="notif-title">
                    <p>Messages</p>
                </div>
                <div class="notif-count">
                    <p class="count">5</p>
                </div>
            </div>
        </div>
    </body>
</html>
