<!DOCTYPE html>
<html>
    <head>
        <style>
            .div1{
                background-color: red;
                width: 100px;
                height: 150px;
                margin-bottom: 10px;
                margin-right: 10px;
                display: inline-block;
                vertical-align: top;
            }

            .div2{
                background-color: green;
                width: 100px;
                height: 100px;
                border-radius: 50%;
                margin-bottom: 10px;
                margin-right: 10px;
                display: inline-block;
                vertical-align: top;
            }

            .div3{
                border: 1px solid rgb(131, 131, 131);
                display: inline-block;
                padding: 10px;

            }

            .div4{
                display: inline-block;
                background-color: rgb(34, 34, 34);
                width: 300px;
                padding-top: 10px;
                padding-bottom: 10px;
                padding-left: 20px;
                padding-right: 20px;
            }

            p{
                font-family: arial;
            }

            .install{
                color: white;
                font-weight: bold;
                font-size: 18px;
            }

            .desc{
                color: gray;
                font-size: 14px;
            }

            .google{
                text-align: center;
                margin-top: 30px;
            }

            .google-logo{
                width: 150px;
                text-align: center;
                display: block;
                margin-left: 50%;
            }

            .search{
                width: 300px;
                height: 25px;
                border-radius: 15px;
                border: none;
                display: block;
                margin-left: 40%;
                box-shadow: 0px 0px 5px lightgray;
                font-size: 10px;
                padding-left: 5px;
                margin-bottom: 20px;
            }

            .google-search,.google-lucky{
                display: inline-block;
                text-align: center;
                background-color: rgb(240, 240, 240);
                color: black;
                width: 130px;
                height: 30px;
                border: 1px solid rgb(200, 200, 200);
                border-radius: 4px;
                font-size: 12px;
                font-family: arial;
                padding-top: 5px;
                padding-bottom: 5px;
                margin-right: 5px;
                border: none;
            }

            .google-search{
                margin-left: 20%;
            }

        </style>
    </head>
    <body>
        <div class="div1">

        </div>

        <div class="div2">

        </div>

        <div class="div3">
            <p>Satisfied with our service?</p>
            <button>Yes</button>
            <button>No</button>
        </div>

        <br>

        <div class="div4">
            <p class="install">Install Youtube Music</p>
            <p class="desc">Add Youtube Music to your desktop for quick and easy access.</p>
        </div>

        <div class="google">
            <img class="google-logo" src="../../Google_2015_logo.svg.webp" alt="Google Logo">
            <input class="search" type="text" placeholder="Search Google or type a URL">
            <button class="google-search">Google Search</button>
            <button class="google-lucky">I'm Feeling Lucky</button>
        </div>
        
    </body>
</html>
